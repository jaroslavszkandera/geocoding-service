services:
  db:
    image: postgis/postgis:16-3.4
    command: postgres -c shared_buffers=1GB -c work_mem=32MB -c random_page_cost=1.1
    container_name: geocoding-db
    environment:
      POSTGRES_DB: geocoding
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/00_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d geocoding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
