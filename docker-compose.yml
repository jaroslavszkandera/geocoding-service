services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geocoding-db
    environment:
      POSTGRES_DB: geocoding
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d geocoding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
